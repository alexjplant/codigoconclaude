name: release

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read version
        id: version
        run: node -p "'version=' + require('./packages/opencode/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Duplicate guard
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "v${{ steps.version.outputs.version }}" && echo "skip=true" >> "$GITHUB_OUTPUT" || echo "skip=false" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: ./packages/opencode/script/build.ts --single
        env:
          OPENCODE_RELEASE: "1"
          GH_REPO: ${{ github.repository }}

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.target }}
          if-no-files-found: error
          path: packages/opencode/dist/opencode-${{ matrix.target }}.*

  release:
    needs: [version, build]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: packages/opencode/dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            --title "v${{ needs.version.outputs.version }}" \
            --notes "Release v${{ needs.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            packages/opencode/dist/opencode-linux-arm64.tar.gz \
            packages/opencode/dist/opencode-darwin-arm64.zip